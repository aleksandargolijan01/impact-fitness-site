<!doctype html>
<html lang="sr-Latn-RS">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e21d2f" />
    <title>Impact Fitness offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, 'Segoe UI', Arial, sans-serif;
        background: #08090b;
        color: #f7f7f8;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025));
      }

      span {
        display: grid;
        width: 48px;
        height: 48px;
        margin-bottom: 18px;
        place-items: center;
        border-radius: 6px;
        background: #e21d2f;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: 1.8rem;
      }

      p {
        margin: 12px 0 0;
        color: #a7abb4;
      }
    </style>
  </head>
  <body>
    <main>
      <span>IF</span>
      <h1>Nema internet konekcije</h1>
      <p>Impact Fitness aplikacija je sacuvana na uredjaju. Proveri vezu i osvezi stranicu.</p>
    </main>
  </body>
</html>
